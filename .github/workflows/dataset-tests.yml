name: Dataset checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check market_data.py dataset_builder research tests build_dataset.py verify_dataset.py validate_dataset.py train_baseline.py
      - run: uv run python verify_dataset.py output/yahoo_20261016T121656Z_dataset_v1_1
