[project]
name = "quant-ml"
version = "0.1.0"
description = "Machine learning research for trading"
readme = "README.md"
authors = [
    { name = "canokan", email = "canokan@okancore.com" },
    { name = "berkeksioglu", email = "berkeksioglu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=14",
    "scikit-learn>=1.9.1",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
